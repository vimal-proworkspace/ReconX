<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ReconX Dashboard</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:640px;margin:3rem auto;padding:0 1rem;background:#f6f8fa;color:#1b1f24}
  form{background:#fff;border:1px solid #d0d7de;border-radius:8px;padding:1.2rem}
  input[type=text]{width:100%;padding:.6rem;margin:.4rem 0 1rem;box-sizing:border-box}
  button{background:#1f6feb;color:#fff;border:0;border-radius:6px;padding:.6rem 1.2rem;cursor:pointer}
  .err{background:#ffebe9;border:1px solid #cf222e;border-radius:8px;padding:.7rem;margin-bottom:1rem}
  label{display:block;margin:.3rem 0}
</style>
</head>
<body>
<h1>ReconX</h1>
<p>Run approved checks against a target you own or are authorized to test.</p>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post" action="/scan">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Target (URL, hostname or IP)
    <input type="text" name="target" placeholder="http://127.0.0.1:3000" required></label>
  <strong>Modules</strong>
  <label><input type="checkbox" name="modules" value="dns"> DNS</label>
  <label><input type="checkbox" name="modules" value="tls"> TLS</label>
  <label><input type="checkbox" name="modules" value="web" checked> Web headers &amp; cookies</label>
  <label><input type="checkbox" name="modules" value="network"> Network ports (local lab only)</label>
  <label><input type="checkbox" name="authorized" value="yes">
    I own this target or have written permission to assess it.</label>
  <button type="submit">Run assessment</button>
</form>
</body>
</html>
